[project]
name = "medical-report-reader"
version = "1.0.0"
description = "Evidence-grounded medical report processing with local OCR and constrained Gemini NLP"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pillow>=11.2,<13",
  "rapidocr-onnxruntime==1.4.4",
  "onnxruntime>=1.20,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
